name: first workflow
on: 
  push:
  pull_request: 
    branches:
      - main
      - dev
      - qa  
jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: setup node js in vm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: run ESLint
        run: npm run lint

      - name: make react buiild
        run: npm run build