name: first workflow
on: 
  push:
  pull_request: 
    branches:
      - main
      - dev
      - qa  
jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: setup node js in vm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: run ESLint
        run: npm run lint
      - name: run test cases
        run: npm run test      

  test-job:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          
        - name: setup node js in vm
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm

        - name: Install dependencies
          run: npm ci
       
        - name: run test cases
          run: npm run test

  build-job:
    needs: [lint-job, test-job]
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          
        - name: setup node js in vm
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm

        - name: Install dependencies
          run: npm ci
       
        - name: run build
          run: npm run build
        - name: Upload build artifacts
          uses: actions/upload-artifact@v4
          with:
           name: build-artifacts
           path: dist/
           retentiion-days: 7

        